server:
  port: 8082

spring:
  application:
    name: stock-service

  datasource:
    url: jdbc:mysql://mysql:3306/ticket_db
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info